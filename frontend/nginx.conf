# Configuration nginx pour servir l'app Angular en production.
# Fallback vers index.html (SPA routing) + proxy /api/v1 vers le backend.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Cache des assets fingerprintés (Angular hashe les fichiers JS/CSS)
  location ~* \.(?:js|css|woff2?|ttf|otf|svg|jpg|jpeg|png|gif|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API → backend NestJS (renommé "backend" dans docker-compose)
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }

  # SPA fallback : toutes les autres routes → index.html (Angular Router gère)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Sécurité
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
