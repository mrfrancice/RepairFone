name: CI — Lint, Build, Test

on:
  push:
    branches: [main, RepairFoneDev, Dev]
  pull_request:
    branches: [main, RepairFoneDev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test -- --passWithNoTests

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build production
        run: npm run build -- --configuration=production

      # Tests désactivés tant que la couverture est trop faible.
      # Réactiver une fois les specs frontend stabilisées (cf. P2.1) :
      # - name: Tests
      #   run: npm test -- --watch=false --browsers=ChromeHeadless --no-progress
